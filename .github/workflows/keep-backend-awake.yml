# The API runs on Render's free plan, which sleeps after 15 minutes without
# traffic; the next visitor then waits ~1 minute. Pinging /health keeps it awake.
# Remove this once the service is on a paid plan.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://mosqai-api.onrender.com/health
